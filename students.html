<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Student portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f1;--bg2:#f4ece0;--card:#fff;--line:#e7dccb;--text:#2b211b;--muted:#6e6152;--accent:#9c2f24;--gold:#c8891c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(120deg,#9c2f24,#6f1f18);color:#fff;padding:32px 0 28px}
header .wrap{display:flex;gap:18px;align-items:center}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.5);background:#dcb99a;flex:none}
header p{margin:4px 0 0;opacity:.85}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:600;color:#f3c77a}
main{padding:24px 0 60px;display:grid;gap:26px}
.note{background:var(--bg2);border-radius:14px;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
.cls__when{font-family:Fraunces,Georgia,serif;font-size:1.25rem;color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:.7em 1.3em;font:600 .95rem Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.btn--ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn--wa{background:#25d366}
.live{display:inline-block;background:#2f7a3e;color:#fff;border-radius:999px;font-size:.75rem;font-weight:600;padding:.2em .7em}
.slots{display:grid;gap:8px}
.slot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.slot b{font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.meta{font-size:.85rem;color:var(--muted)}
form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:.65em .8em;width:100%}
.center{text-align:center;padding:60px 16px}
.tz{font-size:.85rem;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div data-app><p class="center">Opening…</p></div>

<script src="content.js"></script>
<script src="classcrypto.js"></script>
<script>
(async () => {
  const app = document.querySelector("[data-app]");
  const S = window.SITE || {}, CC = window.ClassCrypto;
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const fmtLocal = (d) => new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" }).format(d);
  const fmtIST = (d) => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", weekday: "short", hour: "numeric", minute: "2-digit", hour12: true }).format(d);
  const fmtTime = (d) => new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(d);
  const fmtDay = (d) => new Intl.DateTimeFormat(undefined, { weekday: "long" }).format(d);

  // Link looks like  students.html#p.<portalKey>   or   students.html#c.<classId>.<classKey>
  // The first time a student opens their link, this browser remembers it — they never need the link again.
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
  const h = decodeURIComponent(location.hash.slice(1));
  const fail = (t) => { app.innerHTML = `<div class="center"><h2>Classes are by invitation</h2><p class="muted">${esc(t)}</p><p><a class="btn" href="./#contact">Contact the teacher</a></p></div>`; };
  let invites = {}; try { invites = JSON.parse(store.get("student-invites") || "{}"); } catch {}
  let portalKey = store.get("student-portal"), fromLink = false;
  if (h.startsWith("p.")) { portalKey = h.slice(2); fromLink = true; }
  if (h.startsWith("c.")) { const [, id, ...k] = h.split("."); invites[id] = k.join("."); }
  let self = null; try { self = JSON.parse(store.get("student-self") || "null"); } catch {}
  if (h.startsWith("s.")) { const [, id, ...k] = h.split("."); self = { id, key: k.join(".") }; }
  let me = null;
  if (self && (S.classStudents || {})[self.id]) { try { me = await CC.unlock(S.classStudents[self.id], self.key); store.set("student-self", JSON.stringify(self)); } catch { store.del("student-self"); } }
  else if (self) store.del("student-self");
  let portal = null, expired = false;
  if (portalKey && S.classPortal) {
    try { portal = await CC.unlock(S.classPortal, portalKey); store.set("student-portal", portalKey); }
    catch { if (fromLink) expired = true; else { store.del("student-portal"); expired = true; } }
  }
  const privateSessions = [];
  for (const [id, key] of Object.entries(invites)) {
    const rec = (S.classInvites || {})[id];
    if (!rec) { delete invites[id]; continue; }
    try { privateSessions.push(await CC.unlock(rec, key)); } catch { delete invites[id]; }
  }
  if (Object.keys(invites).length) store.set("student-invites", JSON.stringify(invites)); else store.del("student-invites");
  if (h) history.replaceState(null, "", location.pathname);   // tidy address bar; access is remembered
  if (!me && !portal && !privateSessions.length) return fail(expired || (self && !me)
    ? "Your access link has been reset. Please ask your teacher for the new link."
    : "Open the invitation link your teacher sent you. After that, this page remembers you.");
  const mode = me || portal ? "portal" : "class";
  const data = me || portal || privateSessions[0];
  const info = me || portal;   // fees, availability and "not available" times

  const teacher = data.teacher || "Your teacher";
  const seenIds = new Set();
  const sessions = [...(me ? me.sessions || [] : []), ...(portal ? portal.sessions || [] : []), ...privateSessions].filter((x) => x && !seenIds.has(x.id) && seenIds.add(x.id));
  const now = new Date();
  const upcoming = sessions.map((s) => ({ s, next: CC.nextOccurrence(s, now) })).filter((x) => x.next).sort((a, b) => a.next - b.next);

  const pad = (n) => String(n).padStart(2, "0");
  const icsDate = (d) => `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const ics = (s) => {
    const first = new Date(s.start), end = new Date(first.getTime() + (s.duration || 60) * 6e4);
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//student-portal//EN", "BEGIN:VEVENT", `UID:${s.id}@student-portal`, `DTSTAMP:${icsDate(new Date())}`,
      `DTSTART:${icsDate(first)}`, `DTEND:${icsDate(end)}`, ...((+s.weeks || 1) > 1 ? [`RRULE:FREQ=WEEKLY;COUNT=${s.weeks}`] : []),
      `SUMMARY:${s.title} — ${teacher}`, `LOCATION:${s.link}`, `DESCRIPTION:Join: ${s.link}${s.meetingId ? "\\nMeeting ID: " + s.meetingId : ""}${s.passcode ? "\\nPasscode: " + s.passcode : ""}`,
      "END:VEVENT", "END:VCALENDAR"];
    return URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
  };

  const classCard = ({ s, next }) => {
    const end = new Date(next.getTime() + (s.duration || 60) * 6e4);
    const soon = next - now < 15 * 6e4 && now < end;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(s.title)}</h3>${soon ? `<span class="live">Starting now</span>` : ""}</div>
      <div class="cls__when">${esc(fmtLocal(next))}</div>
      <p class="muted">Your time (${esc(tz)}) · ${esc(fmtIST(next))} India time · ${esc(s.duration || 60)} min${(+s.weeks || 1) > 1 ? " · weekly" : ""}</p>
      ${s.notes ? `<p style="margin:0">${esc(s.notes)}</p>` : ""}
      ${s.meetingId || s.passcode ? `<p class="muted">${[s.meetingId ? `Meeting ID: <b>${esc(s.meetingId)}</b>` : "", s.passcode ? `Passcode: <b>${esc(s.passcode)}</b>` : ""].filter(Boolean).join(" · ")}</p>` : ""}
      <div class="row"><a class="btn" href="${esc(s.link)}" target="_blank" rel="noopener">Join on ${esc(s.platform || CC.platformOf(s.link))}</a>
        <a class="btn btn--ghost" href="${ics(s)}" download="${esc(s.title.replace(/[^\w]+/g, "-"))}.ics">Add to my calendar</a></div></div>`;
  };

  // Availability: weekly IST slots -> the student's own time
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const nextIST = (day, time) => {
    const istNow = new Date(Date.now() + 5.5 * 36e5); // clock time in India
    const todayIdx = (istNow.getUTCDay() + 6) % 7, target = DAYS.indexOf(day);
    let add = (target - todayIdx + 7) % 7;
    const [hh, mm] = time.split(":").map(Number);
    const base = Date.UTC(istNow.getUTCFullYear(), istNow.getUTCMonth(), istNow.getUTCDate() + add, hh, mm) - 5.5 * 36e5;
    return new Date(base < Date.now() ? base + 7 * 864e5 : base);
  };
  // Next 2 weeks of her weekly slots; any slot overlapping another student's class shows "Not available" (no details)
  const istHM = (d) => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(d);
  const istT = (d) => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(d);
  // her "Not available" times: other students' classes + concerts (in the payload) + anything in her Google Classes calendar (busy.json)
  let extraBusy = []; try { extraBusy = await (await fetch("busy.json?t=" + Date.now())).json(); } catch {}
  const mineStarts = new Set(sessions.flatMap((x) => CC.occurrences(x).map((d) => d.getTime())));
  const busy = [...((info && info.busy) || []), ...(Array.isArray(extraBusy) ? extraBusy : [])].map((x) => [new Date(x.s).getTime(), new Date(x.e).getTime()])
    .filter(([bs]) => !mineStarts.has(bs));   // a student's own class (also in Google) isn't "not available" to them
  const mine = sessions.flatMap((x) => CC.occurrences(x).map((d) => [d.getTime(), d.getTime() + (+x.duration || 60) * 6e4]));
  const slots = [];
  for (const a of (info && info.availability) || []) {
    let st = nextIST(a.day, a.from), en = nextIST(a.day, a.to); if (en <= st) en = new Date(en.getTime() + 7 * 864e5);
    for (let w = 0; w < 2; w++) {
      const s0 = st.getTime() + w * 7 * 864e5, e0 = en.getTime() + w * 7 * 864e5;
      // cut the slot at every class boundary, then label each piece
      const cuts = new Set([s0, e0]);
      [...busy, ...mine].forEach(([bs, be]) => { if (bs > s0 && bs < e0) cuts.add(bs); if (be > s0 && be < e0) cuts.add(be); });
      const pts = [...cuts].sort((x, y) => x - y);
      let prev = null;
      for (let i = 0; i < pts.length - 1; i++) {
        const ps = pts[i], pe = pts[i + 1];
        const state = mine.some(([bs, be]) => bs < pe && be > ps) ? "mine" : busy.some(([bs, be]) => bs < pe && be > ps) ? "taken" : "free";
        if (prev && prev.state === state && prev.end.getTime() === ps) prev.end = new Date(pe);
        else slots.push(prev = { a, start: new Date(ps), end: new Date(pe), state, taken: state === "taken" });
      }
    }
  }
  slots.sort((x, y) => x.start - y.start);

  const upiLink = (amt, note) => `upi://pay?pa=${encodeURIComponent(info.upiId)}&pn=${encodeURIComponent(info.upiName || teacher)}&am=${encodeURIComponent(amt)}&cu=INR&tn=${encodeURIComponent(("Class fee " + (note || "")).slice(0, 50))}`;
  const contact = (text) => data.whatsapp ? `https://wa.me/${data.whatsapp}?text=${encodeURIComponent(text)}` : `mailto:${data.email}?subject=${encodeURIComponent("Class request")}&body=${encodeURIComponent(text)}`;

  app.innerHTML = `<header><div class="wrap">${data.photo ? `<img class="avatar" src="${esc(data.photo)}" alt="" onerror="this.remove()">` : ""}
      <div><div class="eyebrow">${mode === "portal" ? "Student portal" : "Class invitation"}</div><h1>${esc(teacher)}</h1>
      <p>${me ? `Welcome, ${esc(me.studentName)} — your classes, join links and my availability` : mode === "portal" ? "Your classes, join links and my availability" : "You're invited to a live online class"}</p></div></div></header>
    <main class="wrap">
      ${info && info.note ? `<div class="note">${esc(info.note)}</div>` : ""}
      <section style="display:grid;gap:12px"><h2>${mode === "portal" ? "Upcoming classes" : "Your class"}</h2>
        ${upcoming.length ? upcoming.map(classCard).join("") : `<div class="card"><p class="muted">${mode === "portal" ? "No classes scheduled right now — request one below." : "This class has finished. Please ask for a new link."}</p></div>`}
        <p class="tz">Times are shown in your time zone: <b>${esc(tz)}</b>.</p></section>
      ${info && ((info.plans || []).length || info.upiId || Object.keys(info.bank || {}).length) ? `<section style="display:grid;gap:12px"><h2>Fees & payment</h2>
        ${info.intro ? `<p style="margin:0">${esc(info.intro)}</p>` : ""}
        ${(info.plans || []).map((p, i) => `<div class="card"><div class="row" style="justify-content:space-between"><h3>${esc(p.name)}</h3>
            <div class="cls__when">${[p.priceINR ? "₹" + Number(p.priceINR).toLocaleString("en-IN") : "", p.priceUSD ? "$" + esc(p.priceUSD) : ""].filter(Boolean).join(" · ")}</div></div>
          ${p.detail ? `<p class="muted">${esc(p.detail)}</p>` : ""}
          <div class="row">${info.upiId && p.priceINR ? `<a class="btn" href="${esc(upiLink(p.priceINR, p.name))}">Pay with UPI</a><button class="btn btn--ghost" data-qr="${i}">Show UPI QR code</button>` : ""}
            ${p.payLink ? `<a class="btn ${info.upiId ? "btn--ghost" : ""}" href="${esc(p.payLink)}" target="_blank" rel="noopener">Pay online (card / international)</a>` : ""}</div>
          <div data-qr-box="${i}" hidden style="text-align:center"></div></div>`).join("")}
        ${info.bank && (info.bank.account || info.bank.ifsc) ? `<div class="card"><h3>Bank transfer</h3>
          ${[["Account name", info.bank.holder], ["Bank", info.bank.bank], ["Account number", info.bank.account], ["IFSC", info.bank.ifsc], ["Branch", info.bank.branch], ["International", info.bank.intl]]
            .filter(([, v]) => v).map(([k, v]) => `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><div><div class="meta">${esc(k)}</div><b>${esc(v)}</b></div>
            <button class="btn btn--ghost" data-copy="${esc(v)}">Copy</button></div>`).join("")}</div>` : ""}
        ${info.upiId ? `<p class="muted">UPI: <b>${esc(info.upiId)}</b>${info.upiName ? " · " + esc(info.upiName) : ""}. Works with GPay, PhonePe, Paytm and any UPI app.${info.payNote ? " " + esc(info.payNote) : ""}</p>` : info.payNote ? `<p class="muted">${esc(info.payNote)}</p>` : ""}
      </section>` : ""}
      ${mode === "portal" ? `<section style="display:grid;gap:12px"><h2>My availability</h2>
        ${slots.length ? `<div class="slots">${slots.map(({ a, start, end, taken, state }) => `<div class="slot" ${taken ? 'style="opacity:.6"' : state === "mine" ? 'style="border-color:#9c2f24"' : ""}><div><b>${esc(fmtDay(start))} ${esc(new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short" }).format(start))}</b> · ${esc(fmtTime(start))} – ${esc(fmtTime(end))}
          <div class="meta">${esc(istHM(start))}–${esc(istT(end))} India time</div></div>
          ${taken ? `<span class="meta" style="font-weight:600">Not available</span>` : state === "mine" ? `<span class="meta" style="font-weight:600;color:#9c2f24">Your class</span>` : `<a class="btn btn--ghost" href="${esc(contact(`Namaste! I'd like to book a class on ${fmtDay(start)} ${fmtTime(start)} (my time) / ${istHM(start)} IST.`))}" target="_blank" rel="noopener">Request this slot</a>`}</div>`).join("")}</div>`
          : `<div class="card"><p class="muted">Availability will be shared soon.</p></div>`}
        <div class="card"><h3>Request a class</h3>
          <form data-req><label>Your name<input name="n" required></label>
          <div class="row" style="gap:10px"><label style="flex:1 1 150px">Preferred date<input name="d" type="date" required></label>
            <label style="flex:1 1 120px">Time (your time)<input name="t" type="time" required step="900"></label>
            <label style="flex:1 1 120px">Length<select name="len"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1 hour</option><option value="90">1½ hours</option></select></label></div>
          <p class="meta" data-req-ist style="margin:0"></p>
          <label>Message<textarea name="m" rows="3" placeholder="Your level, what you'd like to learn…"></textarea></label>
          <div class="row"><button class="btn ${data.whatsapp ? "btn--wa" : ""}">${data.whatsapp ? "Send on WhatsApp" : "Send by email"}</button></div></form></div></section>` : ""}
      <p class="tz" style="text-align:center">This device remembers your access. <a href="#" data-forget>Forget this device</a></p>
    </main>`;
  document.querySelector("[data-forget]").onclick = (e) => { e.preventDefault(); if (confirm("Remove class access from this device?")) { store.del("student-portal"); store.del("student-invites"); location.reload(); } };
  document.querySelectorAll("[data-qr]").forEach((b) => b.onclick = async () => {
    const i = +b.dataset.qr, p = info.plans[i], box = document.querySelector(`[data-qr-box="${i}"]`);
    if (!box.hidden) { box.hidden = true; return; }
    box.hidden = false; box.innerHTML = "<p class='muted'>Loading QR…</p>";
    try {
      if (!window.qrcode) await new Promise((ok, no) => { const t = document.createElement("script"); t.src = "vendor/qrcode.js"; t.onload = ok; t.onerror = no; document.head.appendChild(t); });
      const q = window.qrcode(0, "M"); q.addData(upiLink(p.priceINR, p.name)); q.make();
      box.innerHTML = `<img src="${q.createDataURL(6, 12)}" alt="UPI QR code" style="max-width:240px;width:100%"><p class="muted">Scan with any UPI app · ₹${Number(p.priceINR).toLocaleString("en-IN")}</p>`;
    } catch { box.innerHTML = `<p class="muted">Couldn't load the QR code — pay to UPI ID <b>${esc(info.upiId)}</b>.</p>`; }
  });
  document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied ✓"; setTimeout(() => (b.textContent = "Copy"), 1500); } catch { prompt("Copy:", b.dataset.copy); } });
  const req = document.querySelector("[data-req]");
  if (req) {
    const pad2 = (n) => String(n).padStart(2, "0");
    const tomorrow = new Date(Date.now() + 864e5);
    req.d.min = `${tomorrow.getFullYear()}-${pad2(tomorrow.getMonth() + 1)}-${pad2(tomorrow.getDate())}`;
    const picked = () => { if (!req.d.value || !req.t.value) return null; const st = new Date(`${req.d.value}T${req.t.value}`); return { st, en: new Date(st.getTime() + (+req.len.value) * 6e4) }; };
    const istFull = (d) => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }).format(d);
    const localFull = (d) => new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }).format(d);
    const overlaps = (list, p) => list.some(([bs, be]) => bs < p.en.getTime() && be > p.st.getTime());
    const clash = (p) => overlaps(busy, p) ? "busy" : overlaps(mine, p) ? "mine" : "";
    const info2 = req.querySelector("[data-req-ist]");
    const upd = () => { const p = picked(); if (!p) { info2.textContent = ""; return; }
      const c = clash(p);
      info2.innerHTML = c === "busy" ? `<b style="color:#9c2f24">⚠ Clash — that time is not available. Please choose another.</b>`
        : c === "mine" ? `<b style="color:#9c2f24">⚠ You already have a class at that time.</b>`
        : `✓ Free · that is <b>${esc(istFull(p.st))}</b> in India.`; };
    ["input", "change"].forEach((ev) => req.addEventListener(ev, upd));
    req.onsubmit = (e) => { e.preventDefault(); const f = e.target, p = picked(); if (!p) return;
      if (clash(p)) { upd(); return; }
      const msg = `Namaste! I'm ${f.n.value}. I'd like to request a class:\n` +
        `• ${localFull(p.st)} (my time, ${tz})\n• ${istFull(p.st)} India time\n• ${f.len.value} minutes` + (f.m.value.trim() ? `\n\n${f.m.value.trim()}` : "");
      window.open(contact(msg), "_blank"); };
  }
  document.title = `${teacher} · ${mode === "portal" ? "Student portal" : "Class invitation"}`;
})();
</script>
</body>
</html>
