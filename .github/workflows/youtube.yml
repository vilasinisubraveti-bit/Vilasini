name: Update YouTube videos

on:
  schedule:
    - cron: "30 0 * * *"   # every day, 06:00 IST
  workflow_dispatch:        # "Run workflow" button for an instant refresh
  push:
    paths: ["content.js"]   # also runs when the channel ID is changed

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-youtube.mjs
      - name: Save changes
        run: |
          git config user.name "youtube-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Update YouTube videos" && git pull --rebase && git push)
