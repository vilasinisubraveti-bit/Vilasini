name: Update concerts from Google Calendar

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may start a few minutes late)
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-calendar.mjs
        env:
          GOOGLE_CALENDAR_ICS: ${{ secrets.GOOGLE_CALENDAR_ICS }}
          CALENDAR_ALL_EVENTS: ${{ vars.CALENDAR_ALL_EVENTS }}
      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Update concerts from Google Calendar"
            git pull --rebase
            git push
          fi
