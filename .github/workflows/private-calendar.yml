name: Sync Classes calendar (private)

on:
  schedule:
    - cron: "5 */3 * * *"    # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-private-calendar.mjs
        env:
          GOOGLE_CLASSES_ICS: ${{ secrets.GOOGLE_CLASSES_ICS }}
          CLASS_PIN: ${{ secrets.CLASS_PIN }}
      - name: Save changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add busy.json private-calendar.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync Classes calendar"
            git pull --rebase
            git push
          fi
